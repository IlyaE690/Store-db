version: '3.8'
services:
  neo4j:
    image: neo4j:5-enterprise
    container_name: neo4j-lab
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS='["apoc", "graph-data-science"]'
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data: