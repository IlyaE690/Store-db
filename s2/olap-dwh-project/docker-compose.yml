version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres-oltp-olap
    restart: always
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty007
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15440:5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    container_name: flyway-migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/warehouse
      -user=postgres
      -password=qwerty007
      -locations=filesystem:/flyway/sql
      -connectRetries=60
      migrate
    restart: on-failure

volumes:
  postgres_data: