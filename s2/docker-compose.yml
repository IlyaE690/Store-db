services:

  postgres-shard1:
    image: postgres:17
    container_name: shard1
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "15437:5432"

  postgres-shard2:
    image: postgres:17
    container_name: shard2
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "15438:5432"

  postgres-router:
    image: postgres:17
    container_name: router
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "15439:5432"


  postgres:
    image: postgres:17
    container_name: pg-master
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_master:/var/lib/postgresql/data
    ports:
      - "15432:5432"

  postgres-replica1:
    image: postgres:17
    container_name: pg-replica1
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_replica1:/var/lib/postgresql/data
    ports:
      - "15433:5432"
    depends_on:
      - postgres

  postgres-replica2:
    image: postgres:17
    container_name: pg-replica2
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_replica2:/var/lib/postgresql/data
    ports:
      - "15434:5432"
    depends_on:
      - postgres

  pg-logical:
    image: postgres:17
    container_name: pg-logical
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg_data_logical:/var/lib/postgresql/data
    ports:
      - "15435:5432"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    volumes:
      - ./queries.yml:/queries.yml
    command:
      - "--extend.query-path=/queries.yml"
      - "--collector.stat_statements"
      - "--collector.stat_statements.query_length=300"
      - "--collector.stat_statements.limit=500"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - postgres_exporter

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  flyway:
    image: flyway/flyway
    command:
      - "migrate"
      - "-baselineOnMigrate=true"
      - "-validateMigrationNaming=true"
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      - postgres
    environment:
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
      FLYWAY_BASELINE_VERSION: 1
      FLYWAY_BASELINE_DESCRIPTION: "Initial baseline"
      FLYWAY_SCHEMAS: public

volumes:
  pg_data_master:
  pg_data_replica1:
  pg_data_replica2:
  pg_data_logical: